<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monitoring{% endblock %} · Demo Server Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">Demo <span>Monitor</span></a>
    <nav aria-label="Main">
      <ul class="nav">
        {% if logged_in %}
        <li>
          <a href="{{ url_for('overview') }}"
             {% if request.endpoint == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        </li>
        <li>
          <a href="{{ url_for('server_detail', server_id='demo') }}"
             {% if request.endpoint == 'server_detail' %}aria-current="page"{% endif %}>Server detail</a>
        </li>
        <li>
          <a href="{{ url_for('add_server') }}"
             {% if request.endpoint == 'add_server' %}aria-current="page"{% endif %}>Add server</a>
        </li>
        <li>
          <a href="{{ url_for('logout') }}">Logout</a>
        </li>
        {% else %}
        <li>
          <a href="{{ url_for('login') }}"
             {% if request.endpoint == 'login' %}aria-current="page"{% endif %}>Sign in</a>
        </li>
        {% endif %}
      </ul>
    </nav>
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    Local demo only · binds to 0.0.0.0 · monitoring views require login · in-memory data
  </footer>
</body>
</html>
