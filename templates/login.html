{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1 class="page-title">Sign in</h1>
<p class="page-lead">
  Single admin account for this local demo. Default username: <code>admin</code>.
</p>

<form class="form-stack" method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
  {{ form.hidden_tag() }}
  <label>
    Username
    {{ form.username(autocomplete="username", placeholder="admin") }}
  </label>
  <label>
    Password
    {{ form.password(autocomplete="current-password") }}
  </label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Sign in</button>
  </div>
</form>
{% endblock %}
